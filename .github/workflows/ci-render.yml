name: 🚀 CI - Backend Product Service Render


on:

  push:
    branches:
      - "**"

    tags:
      - "v*"


  pull_request:


  workflow_dispatch:




jobs:


  # ===================================================
  # 🧪 BUILD + TEST
  # ===================================================

  build-and-test:


    name: 🧪 Build & Test - ${{ github.ref_name }}


    runs-on: ubuntu-latest



    outputs:

      version: ${{ steps.metadata.outputs.version }}

      image: ${{ steps.metadata.outputs.image }}



    steps:



      # ===================================================
      # 📦 CHECKOUT
      # ===================================================

      - name: Checkout Code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          fetch-tags: true




      # ===================================================
      # 🐍 PYTHON
      # ===================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"




      # ===================================================
      # 📚 INSTALL
      # ===================================================

      - name: Install Dependencies

        run: |

          pip install --upgrade pip

          pip install -r requirements.txt

          pip install pytest




      # ===================================================
      # 🧪 TEST
      # ===================================================

      - name: Run Tests

        env:

          DATABASE_URL: sqlite:///test.db

          SECRET_KEY: testing-secret

          FLASK_ENV: testing


        run: |

          PYTHONPATH=. pytest -v





      # ===================================================
      # 🔧 METADATA
      # ===================================================

      - name: Set Metadata

        id: metadata


        run: |


          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV



          if [[ "${GITHUB_REF}" == refs/tags/* ]]

          then


            VERSION=${GITHUB_REF#refs/tags/}

            BRANCH="main"

            IMAGE="pythoncodelife/backend-product-service:${VERSION}"


          else


            VERSION=${GITHUB_REF_NAME}

            BRANCH=${GITHUB_REF_NAME}

            IMAGE="N/A"


          fi



          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          echo "BRANCH=${BRANCH}" >> $GITHUB_ENV


          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT



          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "BUILD_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV





      # ===================================================
      # 📧 CI SUCCESS EMAIL
      # ===================================================

      - name: Send CI Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3


        with:


          server_address: smtp.gmail.com

          server_port: 465

          secure: true


          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}



          subject: "✅ CI SUCCESS | Backend Product Service"



          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}



          from: GitHub Actions CI/CD



          body: |


            ✅ CI SUCCESS


            Repository:

            ${{ github.repository }}



            Version:

            ${{ env.VERSION }}



            Commit:

            ${{ env.COMMIT }}



            Branch:

            ${{ env.BRANCH }}






      # ===================================================
      # ❌ CI FAILURE EMAIL
      # ===================================================

      - name: Send CI Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3


        with:


          server_address: smtp.gmail.com

          server_port: 465

          secure: true


          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}



          subject: "❌ CI FAILED | Backend Product Service"



          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}



          from: GitHub Actions CI/CD



          body: |


            ❌ CI FAILED


            Repository:

            ${{ github.repository }}



            Commit:

            ${{ github.sha }}







  # ===================================================
  # 🐳 DOCKER RELEASE
  # ===================================================

  docker-release:


    name: 🐳 Docker Release


    needs:

      - build-and-test



    if: startsWith(github.ref, 'refs/tags/')



    runs-on: ubuntu-latest



    steps:



      # ===================================================
      # 📦 CHECKOUT
      # ===================================================

      - name: Checkout Code

        uses: actions/checkout@v4





      # ===================================================
      # 🐳 LOGIN
      # ===================================================

      - name: Docker Login

        run: |


          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin





      # ===================================================
      # 🏗️ BUILD IMAGE
      # ===================================================

      - name: Build Docker Image


        run: |


          docker build \

          --build-arg APP_VERSION=${{ needs.build-and-test.outputs.version }} \

          --build-arg APP_COMMIT=${GITHUB_SHA} \

          --build-arg APP_BRANCH=main \

          -t ${{ needs.build-and-test.outputs.image }} .






      # ===================================================
      # 🔍 VERIFY BUILD INFO
      # ===================================================

      - name: Verify Build Info


        run: |


          docker run --rm \

          ${{ needs.build-and-test.outputs.image }} \

          sh -c "cat /app/build_info.json"






      # ===================================================
      # 📤 PUSH VERSION
      # ===================================================

      - name: Push Version Image


        run: |


          docker push \

          ${{ needs.build-and-test.outputs.image }}







      # ===================================================
      # 🏷️ PUSH LATEST
      # ===================================================

      - name: Push Latest Image


        run: |


          docker tag \

          ${{ needs.build-and-test.outputs.image }} \

          pythoncodelife/backend-product-service:latest



          docker push \

          pythoncodelife/backend-product-service:latest
