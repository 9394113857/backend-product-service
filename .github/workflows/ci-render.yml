# =====================================================
# 🚀 CI - Backend Product Service (FINAL PRODUCTION)
# =====================================================

name: 🚀 CI - Backend Product Service


on:

  push:

    branches:
      - "**"

    tags:
      - "v*"

  pull_request:

    branches:
      - "**"



# =====================================================
# 🧪 CI TEST JOB
# =====================================================

jobs:


  test:


    name: 🧪 Run Tests

    runs-on: ubuntu-latest


    steps:


      # ===============================
      # Checkout
      # ===============================
      - name: Checkout

        uses: actions/checkout@v4



      # ===============================
      # Python Setup
      # ===============================
      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # ===============================
      # Install Dependencies
      # ===============================
      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      # ===============================
      # Run Tests
      # ===============================
      - name: Run Tests

        run: |

          pytest



      # ===============================
      # Build Info
      # ===============================
      - name: Generate Build Info

        run: |

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then

            VERSION=${GITHUB_REF#refs/tags/}

          else

            VERSION=dev-${GITHUB_SHA}

          fi


          cat <<EOF > build_info.json

          {
            "version": "$VERSION",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF#refs/heads/}",
            "build_time_utc": "$(date -u)",
            "build_time_ist": "$(TZ=Asia/Kolkata date)"
          }

          EOF



      # ===============================
      # CI Success Mail
      # ===============================
      - name: 📧 CI Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CI SUCCESS - Backend Product Service"

          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}


          body: |

            🚀 CI BUILD SUCCESS


            Repository:
            Backend Product Service


            Commit:
            ${{ github.sha }}


            Branch:
            ${{ github.ref }}


            Status:
            Tests Passed



      # ===============================
      # CI Failure Mail
      # ===============================
      - name: ❌ CI Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚨 CI FAILED - Backend Product Service"

          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}


          body: |

            🚨 CI BUILD FAILED


            Repository:
            Backend Product Service


            Commit:
            ${{ github.sha }}


            Branch:
            ${{ github.ref }}


            Action:
            Check GitHub Actions logs.



# =====================================================
# 🐳 DOCKER RELEASE JOB (ONLY TAGS)
# =====================================================


  docker-release:


    name: 🐳 Docker Release


    needs: test


    if: startsWith(github.ref, 'refs/tags/')


    runs-on: ubuntu-latest



    steps:


      # ===============================
      # Checkout
      # ===============================
      - name: Checkout

        uses: actions/checkout@v4



      # ===============================
      # Docker Login
      # ===============================
      - name: Docker Login

        run: |

          echo "${{ secrets.DOCKERHUB_TOKEN }}" |

          docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin



      # ===============================
      # Set Version
      # ===============================
      - name: Set Version

        run: |

          VERSION=${GITHUB_REF#refs/tags/}

          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV



      # ===============================
      # Docker Build
      # ===============================
      - name: Build Docker Image

        run: |

          docker build \
          --build-arg APP_VERSION=${APP_VERSION} \
          --build-arg APP_COMMIT=${GITHUB_SHA} \
          --build-arg APP_BRANCH=release \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
          .



      # ===============================
      # Docker Push
      # ===============================
      - name: Push Docker Image

        run: |

          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION}



      # ===============================
      # Docker Latest Tag
      # ===============================
      - name: Push Latest

        run: |

          docker tag \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:latest


          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:latest
