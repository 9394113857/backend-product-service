# =====================================================
# 🚀 CI - Backend Product Service (FINAL PRODUCTION)
# =====================================================

name: 🚀 CI - Backend Product Service

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:
    branches:
      - "**"


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      # ===============================
      # 🟢 Checkout
      # ===============================
      - name: Checkout
        uses: actions/checkout@v4



      # ===============================
      # 🐍 Setup Python
      # ===============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      # ===============================
      # 📦 Install Dependencies
      # ===============================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



      # ===============================
      # 🧪 Run Tests
      # ===============================
      - name: Run Tests
        run: |
          pytest



      # ===============================
      # 🏷️ Set Build Version
      # ===============================
      - name: Set Version
        run: |

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then

            VERSION=${GITHUB_REF#refs/tags/}
            TYPE="TAG"
            NAME=$VERSION
            BRANCH="release"

          else

            VERSION=dev-${GITHUB_SHA}
            TYPE="BRANCH"
            NAME=${GITHUB_REF#refs/heads/}
            BRANCH=$NAME

          fi


          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "APP_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "TYPE=$TYPE" >> $GITHUB_ENV
          echo "NAME=$NAME" >> $GITHUB_ENV


      # ===============================
      # 📝 Generate Build Info
      # ===============================
      - name: Generate build_info.json
        run: |

          cat <<EOF > build_info.json
          {
            "version": "${APP_VERSION}",
            "commit": "${APP_COMMIT}",
            "branch": "${APP_BRANCH}",
            "build_time_utc": "$(date -u)",
            "build_time_ist": "$(TZ=Asia/Kolkata date)"
          }
          EOF



      # =====================================================
      # 🐳 Docker Build & Push (ONLY TAGS)
      # =====================================================
      - name: Docker Login
        if: startsWith(github.ref, 'refs/tags/')
        run: |

          echo "${{ secrets.DOCKERHUB_TOKEN }}" |
          docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin



      - name: Build Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |

          docker build \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg APP_COMMIT=${APP_COMMIT} \
            --build-arg APP_BRANCH=${APP_BRANCH} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
            .



      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |

          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION}



      - name: Push Latest Image
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          github.ref == 'refs/tags/latest'

        run: |

          docker tag \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:latest


          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:latest



      # ===============================
      # 📧 CI Success Email
      # ===============================
      - name: 📧 CI Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CI SUCCESS - Backend Product Service"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            🚀 CI BUILD SUCCESS

            Application:
            Backend Product Service


            Version:
            ${{ env.APP_VERSION }}


            Commit:
            ${{ env.APP_COMMIT }}


            Branch:
            ${{ env.APP_BRANCH }}


            Docker:
            Image pushed successfully



      # ===============================
      # ❌ CI Failure Email
      # ===============================
      - name: ❌ CI Failure Email
        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚨 CI FAILED - Backend Product Service"


          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}


          body: |

            🚨 CI BUILD FAILED


            Application:
            Backend Product Service


            Commit:
            ${{ env.APP_COMMIT }}


            Branch:
            ${{ env.APP_BRANCH }}


            Action:
            Check GitHub Actions logs immediately
