# =====================================================
# 🚀 CI - Backend Product Service Render
# =====================================================

name: 🚀 CI - Backend Product Service Render

on:

  # =====================================================
  # 📌 PUSH
  # =====================================================

  push:

    branches:
      - "**"

    tags:
      - "v*"


  # =====================================================
  # 🔀 PULL REQUEST
  # =====================================================

  pull_request:

    branches:
      - "**"


  # =====================================================
  # 🖐️ MANUAL
  # =====================================================

  workflow_dispatch:


jobs:

  # =====================================================
  # 🧪 TEST JOB
  # =====================================================

  test:

    name: 🧪 Test Backend Product Service

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # 📦 CHECKOUT
      # =====================================

      - name: Checkout

        uses: actions/checkout@v4


      # =====================================
      # 🐍 SETUP PYTHON
      # =====================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # =====================================
      # 📚 INSTALL DEPENDENCIES
      # =====================================

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pytest


      # =====================================
      # 🧪 RUN TESTS
      # =====================================

      - name: Run Tests

        run: |

          PYTHONPATH=. pytest -v


      # =====================================
      # 📧 CI SUCCESS EMAIL
      # =====================================

      - name: 📧 CI Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CI SUCCESS - Backend Product Service"

          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}

          from: Backend Product Service <${{ secrets.MAIL_USERNAME }}>

          body: |

            🚀 CI SUCCESS

            Service:
            Backend Product Service

            Repository:
            ${{ github.repository }}

            Commit:
            ${{ github.sha }}

            Branch:
            ${{ github.ref }}

            Status:
            Tests Passed


      # =====================================
      # ❌ CI FAILURE EMAIL
      # =====================================

      - name: ❌ CI Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚨 CI FAILED - Backend Product Service"

          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}

          from: Backend Product Service <${{ secrets.MAIL_USERNAME }}>

          body: |

            🚨 CI FAILED

            Service:
            Backend Product Service

            Repository:
            ${{ github.repository }}

            Commit:
            ${{ github.sha }}

            Branch:
            ${{ github.ref }}

            Status:
            Tests Failed

            Check GitHub Actions logs.


  # =====================================================
  # 🐳 DOCKER RELEASE ONLY FOR TAGS
  # =====================================================

  docker-release:

    name: 🐳 Docker Release

    needs: test

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # 📦 CHECKOUT
      # =====================================

      - name: Checkout

        uses: actions/checkout@v4


      # =====================================
      # 🔐 DOCKER LOGIN
      # =====================================

      - name: Docker Login

        run: |

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin


      # =====================================
      # 🏷️ SET VERSION METADATA
      # =====================================

      - name: Set Metadata

        run: |

          VERSION=${GITHUB_REF#refs/tags/}

          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          echo "APP_BRANCH=main" >> $GITHUB_ENV


      # =====================================
      # 📄 GENERATE BUILD INFO
      # =====================================

      - name: Generate Build Info

        run: |

          cat > build_info.json <<EOF
          {
            "version": "${APP_VERSION}",
            "commit": "${GITHUB_SHA}",
            "branch": "${APP_BRANCH}",
            "build_time_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "build_time_ist": "$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')"
          }
          EOF

          echo "===== BUILD INFO ====="

          cat build_info.json


      # =====================================
      # 🏗️ BUILD DOCKER IMAGE
      # =====================================

      - name: Build Docker Image

        run: |

          docker build \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg APP_COMMIT=${GITHUB_SHA} \
            --build-arg APP_BRANCH=${APP_BRANCH} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
            .


      # =====================================
      # 🔍 VERIFY DOCKER IMAGE
      # =====================================

      - name: Verify Docker Image

        run: |

          docker run --rm \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
            sh -c "ls -la /app && echo '--- build info ---' && cat /app/build_info.json"


      # =====================================
      # 📤 PUSH VERSION IMAGE
      # =====================================

      - name: Push Version Image

        run: |

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION}


      # =====================================
      # 🏷️ PUSH LATEST
      # =====================================

      - name: Push Latest

        run: |

          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:${APP_VERSION} \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-product-service:latest