name: 🚀 CD - Backend Product Service Render


on:


  # ===================================================
  # 🖐️ MANUAL DEPLOYMENT
  # ===================================================

  workflow_dispatch:



  # ===================================================
  # ⏰ DAILY DEPLOYMENT CHECK
  # 2 AM IST = 20:30 UTC previous day
  # ===================================================

  schedule:

    - cron: "30 20 * * *"





jobs:


  # ===================================================
  # 🚀 DEPLOYMENT JOB
  # ===================================================

  deploy:


    name: 🚀 Deploy Backend Product Service


    runs-on: ubuntu-latest





    steps:



      # ===================================================
      # 📦 CHECKOUT
      # ===================================================

      - name: Checkout Code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          fetch-tags: true





      # ===================================================
      # 🔧 SET DEPLOYMENT METADATA
      # ===================================================

      - name: Set Deployment Metadata

        run: |


          git fetch --tags



          TAGS=($(git tag --sort=-v:refname))



          if [ ${#TAGS[@]} -eq 0 ]

          then

            VERSION="latest"

          else

            VERSION=${TAGS[0]}

          fi



          echo "VERSION=${VERSION}" >> $GITHUB_ENV


          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV



          if [[ "${GITHUB_REF}" == refs/tags/* ]]

          then

            echo "BRANCH=main" >> $GITHUB_ENV

          else

            echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          fi



          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV



          echo "SERVICE_URL=https://backend-product-service-ncl2.onrender.com" >> $GITHUB_ENV






      # ===================================================
      # 🚀 TRIGGER RENDER DEPLOYMENT
      # ===================================================

      - name: Trigger Render Deployment

        run: |


          echo "🚀 Triggering Render Deployment..."

          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"







      # ===================================================
      # ⏳ WAIT FOR APPLICATION STARTUP
      # ===================================================

      - name: Wait For Application Startup


        run: |


          echo "Waiting for Render deployment..."



          for i in {30..1}

          do

            echo "Health check starts in ${i} second(s)..."

            sleep 1

          done



          echo "Starting Health Check..."







      # ===================================================
      # ❤️ HEALTH CHECK
      # ===================================================

      - name: Health Check


        run: |


          echo "Checking application health..."



          for i in {1..10}

          do



            STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            "${{ env.SERVICE_URL }}")



            echo "Health Check Attempt $i of 10 → HTTP $STATUS"



            if [ "$STATUS" = "200" ]

            then


              echo "Application is healthy."

              echo "DEPLOY_STATUS=SUCCESS" >> $GITHUB_ENV


              exit 0


            fi



            sleep 10



          done





          echo "Health check failed after retries."

          echo "DEPLOY_STATUS=FAILED" >> $GITHUB_ENV



          exit 1







      # ===================================================
      # 📧 DEPLOY SUCCESS EMAIL
      # ===================================================

      - name: Send Deployment Success Email


        if: success()



        uses: dawidd6/action-send-mail@v3



        with:


          server_address: smtp.gmail.com


          server_port: 587


          username: ${{ secrets.MAIL_USERNAME_MAIN }}


          password: ${{ secrets.MAIL_PASSWORD_MAIN }}



          subject: "🚀 DEPLOY SUCCESS | Backend Product Service ${{ env.VERSION }}"



          to: ${{ secrets.MAIL_USERNAME_MAIN }}


          cc: ${{ secrets.MAIL_TO_CC_MAIN }}



          from: ${{ secrets.MAIL_USERNAME_MAIN }}




          body: |


            🚀 DEPLOYMENT SUCCESS


            =================================================


            🌐 SERVICE

            Backend Product Service



            🔗 URL

            ${{ env.SERVICE_URL }}



            =================================================


            🏷️ VERSION

            ${{ env.VERSION }}



            🔖 COMMIT

            ${{ env.COMMIT }}



            🌿 BRANCH

            ${{ env.BRANCH }}



            ⚡ TRIGGER

            ${{ github.event_name }}



            👤 TRIGGERED BY

            ${{ github.actor }}



            =================================================


            ⏰ DEPLOY TIME UTC

            ${{ env.DEPLOY_TIME_UTC }}



            ⏰ DEPLOY TIME IST

            ${{ env.DEPLOY_TIME_IST }}



            ❤️ HEALTH STATUS

            ${{ env.DEPLOY_STATUS }}







      # ===================================================
      # ❌ DEPLOY FAILURE EMAIL
      # ===================================================

      - name: Send Deployment Failure Email


        if: failure()



        uses: dawidd6/action-send-mail@v3




        with:


          server_address: smtp.gmail.com


          server_port: 587


          username: ${{ secrets.MAIL_USERNAME_MAIN }}


          password: ${{ secrets.MAIL_PASSWORD_MAIN }}



          subject: "❌ DEPLOY FAILED | Backend Product Service"



          to: ${{ secrets.MAIL_USERNAME_MAIN }}


          cc: ${{ secrets.MAIL_TO_CC_MAIN }}



          from: ${{ secrets.MAIL_USERNAME_MAIN }}




          body: |


            ❌ DEPLOYMENT FAILED


            =================================================


            Repository:

            ${{ github.repository }}



            Version:

            ${{ env.VERSION }}



            Commit:

            ${{ github.sha }}



            Branch:

            ${{ env.BRANCH }}



            Trigger:

            ${{ github.event_name }}



            Triggered By:

            ${{ github.actor }}



            =================================================


            Please check:


            ❌ GitHub Actions logs

            ❌ Render deployment logs

            ❌ Application health endpoint
