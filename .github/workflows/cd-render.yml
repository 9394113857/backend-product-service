# =====================================================
# 🚀 CD - Backend Product Service Render
# =====================================================

name: 🚀 CD - Backend Product Service Render

run-name: 🚀 Deploy ${{ github.event_name }} | ${{ github.ref_name }} | ${{ github.actor }}


on:

  # =====================================================
  # 🤖 AUTOMATIC DEPLOYMENT AFTER A SUCCESSFUL CI RELEASE
  # =====================================================

  workflow_run:
    workflows:
      - "🚀 CI - Backend Product Service Render"
    types:
      - completed


  # =====================================================
  # 🖐️ MANUAL DEPLOYMENT
  # =====================================================

  workflow_dispatch:


  # =====================================================
  # ⏰ DAILY DEPLOYMENT
  # 2:00 AM IST = 20:30 UTC previous day
  # =====================================================

  schedule:

    - cron: "30 20 * * *"


# The workflow_run token must be able to inspect the completed CI jobs.
permissions:
  contents: read
  actions: read

# Avoid overlapping automatic, manual, or scheduled deployments.
concurrency:
  group: backend-product-service-render-deployment
  cancel-in-progress: false


jobs:

  # =====================================================
  # 🚀 DEPLOYMENT JOB
  # =====================================================

  deploy:

    name: 🚀 Deploy Backend Product Service

    runs-on: ubuntu-latest

    timeout-minutes: 20

    # Manual and scheduled deployments remain unchanged.
    # Automatic CD is allowed only for a successful v* tag CI run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    steps:

      # =====================================================
      # 🔎 VERIFY BOTH CI AND DOCKER RELEASE JOBS
      # =====================================================

      - name: Verify CI And Docker Release Jobs

        if: github.event_name == 'workflow_run'

        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Checking completed Product Service CI run: $CI_RUN_ID"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")

          TEST_RESULT=$(printf '%s' "$RESPONSE" | jq -r '
            [.jobs[] | select(.name == "🧪 Test Backend Product Service")][0].conclusion // "missing"
          ')

          DOCKER_RESULT=$(printf '%s' "$RESPONSE" | jq -r '
            [.jobs[] | select(.name == "🐳 Docker Release")][0].conclusion // "missing"
          ')

          echo "Product Service test result: $TEST_RESULT"
          echo "Docker release result: $DOCKER_RESULT"

          if [ "$TEST_RESULT" != "success" ]; then
            echo "Product Service CI tests did not succeed. Deployment stopped."
            exit 1
          fi

          if [ "$DOCKER_RESULT" != "success" ]; then
            echo "Docker Release did not succeed. A skipped or failed release cannot deploy."
            exit 1
          fi

          echo "CI tests and Docker image release both succeeded."


      # =====================================================
      # 📦 CHECKOUT
      # =====================================================

      - name: Checkout

        uses: actions/checkout@v4

        with:
          # Automatic release deployments validate against main.
          # Manual/scheduled runs retain the selected/default ref.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
          fetch-tags: true


      # =====================================================
      # 🏷️ DETECT DEPLOYMENT METADATA
      # =====================================================

      - name: Detect Deployment Metadata

        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

        shell: bash

        run: |
          set -euo pipefail

          git fetch --force origin main
          git fetch --force --tags

          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            VERSION="$RELEASE_TAG"

            if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
              echo "Invalid Product Service release tag: $VERSION"
              exit 1
            fi

            if ! git rev-parse --verify "refs/tags/$VERSION^{commit}" >/dev/null 2>&1; then
              echo "Release tag does not exist: $VERSION"
              exit 1
            fi

            TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")

            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Release tag commit does not match the successful CI commit."
              echo "Tag commit: $TAG_SHA"
              echo "CI commit:  $RELEASE_SHA"
              exit 1
            fi

            if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
              echo "Release tag is not the current main branch HEAD."
              echo "Tagged commit: $TAG_SHA"
              echo "Main HEAD:     $MAIN_SHA"
              echo "Render deployment stopped to prevent deploying a different commit."
              exit 1
            fi

            COMMIT="$TAG_SHA"
            DEPLOY_TRIGGER="Successful CI and Docker version-tag release"
          else
            TAGS=($(git tag --sort=-v:refname))

            if [ ${#TAGS[@]} -eq 0 ]; then
              VERSION="latest"
            else
              VERSION="${TAGS[0]}"
            fi

            COMMIT="$GITHUB_SHA"

            if [ "$EVENT_NAME" = "schedule" ]; then
              DEPLOY_TRIGGER="Scheduled daily deployment"
            else
              DEPLOY_TRIGGER="Manual deployment"
            fi
          fi

          BRANCH="main"
          SERVICE_URL="https://backend-product-service-ncl2.onrender.com"
          DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')

          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$COMMIT"
            echo "BRANCH=$BRANCH"
            echo "DEPLOY_TRIGGER=$DEPLOY_TRIGGER"
            echo "DEPLOY_TIME_UTC=$DEPLOY_TIME_UTC"
            echo "DEPLOY_TIME_IST=$DEPLOY_TIME_IST"
            echo "SERVICE_URL=$SERVICE_URL"
          } >> "$GITHUB_ENV"

          echo "======================================"
          echo "Backend Product Service Deployment"
          echo "======================================"
          echo "Version: $VERSION"
          echo "Commit:  $COMMIT"
          echo "Branch:  $BRANCH"
          echo "Trigger: $DEPLOY_TRIGGER"


      # =====================================================
      # 🚀 TRIGGER RENDER DEPLOYMENT
      # =====================================================

      - name: Trigger Render Deploy

        run: |

          echo "🚀 Triggering Render Deployment..."

          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


      # =====================================================
      # ⏳ WAIT FOR APPLICATION STARTUP
      # =====================================================

      - name: Wait For Startup

        run: |

          echo "Waiting for application startup..."

          sleep 30


      # =====================================================
      # ❤️ HEALTH CHECK
      # =====================================================

      - name: Health Check

        run: |

          echo "🔍 Checking Backend Product Service Health..."


          for i in {1..10}

          do

            STATUS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              "${{ secrets.APPLICATION_HEALTH_URL }}")


            REMAINING=$((10 - i))
            
            echo "❤️ Health Check Attempt $i/10 → HTTP $STATUS | ⏳ Remaining: $REMAINING"


            if [ "$STATUS" = "200" ]

            then

              echo "🟢 Backend Product Service Healthy"

              echo "DEPLOY_STATUS=SUCCESS" >> $GITHUB_ENV

              exit 0

            fi


            sleep 10

          done


          echo "DEPLOY_STATUS=FAILED" >> $GITHUB_ENV

          echo "🔴 Backend Product Service health check failed"

          exit 1


      # =====================================================
      # 📧 DEPLOYMENT SUCCESS EMAIL
      # =====================================================

      - name: 📧 Deployment Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CD SUCCESS | Backend Product Service ${{ env.VERSION }}"

          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}

          from: Backend Product Service <${{ secrets.MAIL_USERNAME }}>

          body: |

            🚀 DEPLOYMENT SUCCESS

            Service:
            Backend Product Service

            URL:
            ${{ env.SERVICE_URL }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Trigger:
            ${{ env.DEPLOY_TRIGGER || github.event_name }}

            Triggered By:
            ${{ github.actor }}

            Deploy Time UTC:
            ${{ env.DEPLOY_TIME_UTC }}

            Deploy Time IST:
            ${{ env.DEPLOY_TIME_IST }}

            Health:
            ${{ env.DEPLOY_STATUS }}


      # =====================================================
      # ❌ DEPLOYMENT FAILURE EMAIL
      # =====================================================

      - name: ❌ Deployment Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚨 CD FAILED | Backend Product Service"

          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}

          from: Backend Product Service <${{ secrets.MAIL_USERNAME }}>

          body: |

            🚨 DEPLOYMENT FAILED

            Service:
            Backend Product Service

            URL:
            ${{ env.SERVICE_URL }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ github.sha }}

            Branch:
            ${{ env.BRANCH }}

            Trigger:
            ${{ github.event_name }}

            Triggered By:
            ${{ github.actor }}

            Please check:

            ❌ GitHub Actions logs

            ❌ Render deployment logs

            ❌ Application health endpoint
